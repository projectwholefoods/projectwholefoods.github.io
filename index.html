<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <!-- Google Fonts for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & BASICS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            overflow: hidden; /* Prevent scrollbars from floating shapes */
            background-color: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
        }

        /* --- MOVING BACKGROUND SHAPES (The Blobs) --- */
        .background-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s infinite alternate;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(#ff00cc, #333399);
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(#00c6ff, #0072ff);
            bottom: -100px;
            right: -50px;
            animation-delay: -2s;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: #ff9966;
            top: 40%;
            left: 60%;
            animation-duration: 15s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(30px, 50px) rotate(10deg); }
        }

        /* --- GLASS CARD CONTAINER --- */
        .glass-card {
            width: 90%;
            max-width: 500px;
            min-height: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); /* Safari support */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #fff, #ddd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* --- COUNTDOWN TIMER --- */
        .countdown {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 10px;
            min-width: 70px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .time-val {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .time-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        /* --- EMAIL INPUT FORM --- */
        .input-group {
            position: relative;
            width: 100%;
            display: flex;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        button {
            position: absolute;
            right: 5px;
            top: 5px;
            bottom: 5px;
            padding: 0 20px;
            border-radius: 25px;
            border: none;
            background: white;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        /* --- PROGRESS BAR --- */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 70%; /* Static for demo, can be dynamic */
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border-radius: 10px;
            animation: shimmer 2s infinite linear;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .countdown { gap: 8px; }
            .time-box { min-width: 55px; padding: 8px; }
            .time-val { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="background-shape shape-1"></div>
    <div class="background-shape shape-2"></div>
    <div class="background-shape shape-3"></div>

    <!-- Main Glass Card -->
    <div class="glass-card">
        <h1>In The Works</h1>
        <p>We are currently reconstructing our digital presence to serve you better. Something amazing is coming.</p>

        <!-- Progress Bar Decoration -->
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <!-- Countdown -->
        <div class="countdown">
            <div class="time-box">
                <span class="time-val" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="hours">00</span>
                <span class="time-label">Hrs</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="minutes">00</span>
                <span class="time-label">Min</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="seconds">00</span>
                <span class="time-label">Sec</span>
            </div>
        </div>

        <!-- Notify Form -->
        <form class="input-group" onsubmit="event.preventDefault(); alert('Thanks! We will notify you.');">
            <input type="email" placeholder="Enter your email for updates" required>
            <button type="submit">Notify Me</button>
